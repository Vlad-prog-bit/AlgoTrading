[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algotrading"
version = "0.1.0"
description = "Research scaffold for financial RAG, trading hypotheses and backtesting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "catboost==1.2.10",
    "torch==2.14.1",
    "transformers==5.19.0",
    "sentence-transformers==6.1.0",
    "faiss-cpu==1.15.1",
    "openai-whisper==20250625",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "yt-dlp==2026.8.19",
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "plotly==7.1.0",
    "jupyterlab==4.6.4",
    "ipykernel==7.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "pyyaml==6.0.3",
    "pydantic==2.14.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pypdf==6.19.0",
    "pymupdf==1.28.2",
    "pyarrow==25.0.1",
    "backtesting==0.6.6",
]

[tool.setuptools.packages.find]
where = ["src"]
